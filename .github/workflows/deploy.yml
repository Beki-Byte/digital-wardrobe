name: Deploy auf GitHub Pages

# Baut die App (Branch main) und – falls vorhanden – die Startseite
# (Branch startseite) und veröffentlicht beides zusammen:
#   /            → App
#   /start/      → 3D-Startseite
#   /neu/        → neue App zum Ausprobieren (Branch app-neu)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Startseite auschecken (Branch startseite)
        id: start
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: startseite
          path: _startseite
      - name: Startseite bauen
        if: steps.start.outcome == 'success'
        working-directory: _startseite
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/start
          cp -r dist/. ../dist/start/

      - name: Neue App auschecken (Branch app-neu)
        id: neu
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: app-neu
          path: _app-neu
      - name: Neue App bauen
        if: steps.neu.outcome == 'success'
        working-directory: _app-neu
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/neu
          cp -r dist/. ../dist/neu/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
